# Backend build automation (go-task: brew/choco install go-task).
# Produces release-named binaries in build/ — the TLC plugin imports them
# from this directory locally, or from GitHub releases in CI:
#   build/tlc-ovgenai-runner-linux-x64
#   build/tlc-ovgenai-runner-win32-x64.exe
#   build/tlc-ovgenai-runner-macos-arm64   (dev builds only, not a target)
#
# Windows binaries require a native Windows host or CI: OpenVINO ships MSVC
# libs, cross-compilation is not supported. Linux builds in Docker
# (--platform linux/amd64) from any host.

version: '3'

vars:
  OV_VERSION: '2026.4.0.0'
  OV_MAC_VERSION: '2026.4.1.0rc2' # macOS archives only exist as pre-release
  OV_CACHE_DIR: '.cache/ov-genai'
  BUILD_DIR: 'build'
  URL_LINUX: 'https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/{{.OV_VERSION}}/linux/openvino_genai_ubuntu24_{{.OV_VERSION}}_x86_64.tar.gz'
  URL_WINDOWS: 'https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/{{.OV_VERSION}}/windows/openvino_genai_windows_{{.OV_VERSION}}_x86_64.zip'
  URL_MAC: 'https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/pre-release/{{.OV_MAC_VERSION}}/openvino_genai_macos_12_6_{{.OV_MAC_VERSION}}_arm64.tar.gz'
  DIR_LINUX: '{{.OV_CACHE_DIR}}/linux/openvino_genai_ubuntu24_{{.OV_VERSION}}_x86_64'
  DIR_WINDOWS: '{{.OV_CACHE_DIR}}/windows/openvino_genai_windows_{{.OV_VERSION}}_x86_64'
  DIR_MAC: '{{.OV_CACHE_DIR}}/mac/openvino_genai_macos_12_6_{{.OV_MAC_VERSION}}_arm64'
  OV_DIR_POSIX: '{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/cmake'

tasks:
  default:
    desc: Build the runner for the host OS and Linux (Docker)
    cmds:
      - task: build
      - task: linux

  runtime:
    desc: Download and unpack the OpenVINO GenAI archive for the host OS
    deps: ['runtime:{{if eq OS "windows"}}windows{{else if eq OS "darwin"}}mac{{else}}linux{{end}}']

  runtime:linux:
    status:
      - test -d '{{.DIR_LINUX}}/runtime/lib'
    cmds:
      - mkdir -p '{{.OV_CACHE_DIR}}/linux'
      - task: download
        vars: { URL: '{{.URL_LINUX}}', FILE: '{{.OV_CACHE_DIR}}/linux/ov.tgz' }
      - tar xzf '{{.OV_CACHE_DIR}}/linux/ov.tgz' -C '{{.OV_CACHE_DIR}}/linux'
      - rm '{{.OV_CACHE_DIR}}/linux/ov.tgz'
    generates:
      - '{{.DIR_LINUX}}/runtime/lib/**'

  runtime:mac:
    status:
      - test -d '{{.DIR_MAC}}/runtime/lib'
    cmds:
      - mkdir -p '{{.OV_CACHE_DIR}}/mac'
      - task: download
        vars: { URL: '{{.URL_MAC}}', FILE: '{{.OV_CACHE_DIR}}/mac/ov.tgz' }
      - tar xzf '{{.OV_CACHE_DIR}}/mac/ov.tgz' -C '{{.OV_CACHE_DIR}}/mac'
      - rm '{{.OV_CACHE_DIR}}/mac/ov.tgz'
    generates:
      - '{{.DIR_MAC}}/runtime/lib/**'

  runtime:windows:
    platforms: [windows]
    status:
      - powershell -Command "Test-Path '{{.DIR_WINDOWS}}\runtime\bin'"
    cmds:
      - powershell -Command "New-Item -ItemType Directory -Force '{{.OV_CACHE_DIR}}\windows' | Out-Null; Invoke-WebRequest '{{.URL_WINDOWS}}' -OutFile '{{.OV_CACHE_DIR}}\windows\ov.zip'; Expand-Archive '{{.OV_CACHE_DIR}}\windows\ov.zip' -DestinationPath '{{.OV_CACHE_DIR}}\windows' -Force; Remove-Item '{{.OV_CACHE_DIR}}\windows\ov.zip'"
    generates:
      - '{{.DIR_WINDOWS}}/runtime/bin/**'

  download:
    desc: Resumable download; drops proxy HTML error pages before resuming
    cmds:
      - |
        f='{{.FILE}}'
        for i in 1 2 3 4 5 6; do
          [ -f "$f" ] && [ "$(head -c 4 "$f")" = "HTTP" ] && rm -f "$f"
          curl -fSsL -C - --retry 3 --retry-delay 2 '{{.URL}}' -o "$f" && exit 0
          echo "download attempt $i failed, resuming…"; sleep 3
        done
        exit 1

  build:
    desc: 'Native runner build for the host OS (mac: clang, win: MSVC)'
    deps: [runtime]
    cmds:
      - task: 'build:{{if eq OS "windows"}}windows{{else}}posix{{end}}'

  build:posix:
    platforms: [linux, darwin]
    cmds:
      - cmake -S . -B '{{.BUILD_DIR}}/{{OS}}' -DOpenVINO_DIR='{{.OV_DIR_POSIX}}' -DCMAKE_BUILD_TYPE=Release
      - cmake --build '{{.BUILD_DIR}}/{{OS}}' --config Release
      - mkdir -p '{{.BUILD_DIR}}'
      - cp '{{.BUILD_DIR}}/{{OS}}/tlc-ovgenai-runner' '{{.BUILD_DIR}}/{{if eq OS "linux"}}tlc-ovgenai-runner-linux-x64{{else}}tlc-ovgenai-runner-macos-arm64{{end}}'
    sources:
      - src/**/*
      - CMakeLists.txt
    generates:
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-linux-x64'
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-macos-arm64'

  build:windows:
    platforms: [windows]
    cmds:
      - cmake -S . -B '{{.BUILD_DIR}}\windows' -DOpenVINO_DIR='{{.DIR_WINDOWS}}\runtime\cmake' -DCMAKE_BUILD_TYPE=Release
      - cmake --build '{{.BUILD_DIR}}\windows' --config Release
      - powershell -Command "New-Item -ItemType Directory -Force '{{.BUILD_DIR}}' | Out-Null; Copy-Item '{{.BUILD_DIR}}\windows\Release\tlc-ovgenai-runner.exe' '{{.BUILD_DIR}}\tlc-ovgenai-runner-win32-x64.exe'"
    sources:
      - src/**/*
      - CMakeLists.txt
    generates:
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-win32-x64.exe'

  linux:
    desc: Build the Linux x64 runner in Docker (works from mac/linux/windows+WSL2)
    deps: [runtime:linux]
    cmds:
      - |
        docker run --rm --platform linux/amd64 \
          -v '{{.USER_WORKING_DIR}}:/src:ro' \
          -v '{{.USER_WORKING_DIR}}/{{.OV_CACHE_DIR}}/linux:/ov:ro' \
          -v '{{.USER_WORKING_DIR}}/{{.BUILD_DIR}}/docker:/out' \
          ubuntu:24.04 bash -c '\
            apt-get update -qq >/dev/null && \
            apt-get install -y -qq cmake g++ ocl-icd-opencl-dev >/dev/null && \
            cmake -S /src -B /tmp/build -DOpenVINO_DIR=/ov/openvino_genai_ubuntu24_{{.OV_VERSION}}_x86_64/runtime/cmake -DCMAKE_BUILD_TYPE=Release && \
            cmake --build /tmp/build --config Release && \
            cp /tmp/build/tlc-ovgenai-runner /out/'
      - cp '{{.BUILD_DIR}}/docker/tlc-ovgenai-runner' '{{.BUILD_DIR}}/tlc-ovgenai-runner-linux-x64'
    sources:
      - src/**/*
      - CMakeLists.txt
      - '{{.OV_CACHE_DIR}}/linux/**'
    generates:
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-linux-x64'

  smoke:
    desc: NDJSON smoke run (set MODEL_DIR to an int4-ov model directory)
    deps: [build]
    env:
      DYLD_LIBRARY_PATH: '{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/lib/intel64:{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/3rdparty/tbb/lib'
      LD_LIBRARY_PATH: '{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/lib/intel64:{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/3rdparty/tbb/lib'
    cmds:
      - |
        echo '{"type":"generate","id":1,"prompt":"<|fim_prefix|>def add(a, b):\n    <|fim_suffix|>\n    return a + b<|fim_middle|>","maxTokens":16,"stop":["\n"]}' \
        | {{if eq OS "windows"}}{{.BUILD_DIR}}\tlc-ovgenai-runner-win32-x64.exe{{else}}{{.BUILD_DIR}}/{{if eq OS "linux"}}tlc-ovgenai-runner-linux-x64{{else}}tlc-ovgenai-runner-macos-arm64{{end}}{{end}} \
        --model "${MODEL_DIR:?set MODEL_DIR to an int4-ov model directory}" --device CPU

  clean:
    desc: Remove build artifacts and the downloaded OpenVINO runtime cache
    cmds:
      - rm -rf '{{.BUILD_DIR}}' '{{.OV_CACHE_DIR}}'
      - cmd: powershell -Command "Remove-Item -Recurse -Force build,.cache -ErrorAction SilentlyContinue"
        platforms: [windows]
