name: Runner

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tlc-ovgenai-runner-win32-x64.exe
          - os: ubuntu-latest
            artifact: tlc-ovgenai-runner-linux-x64
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - name: build and loader smoke
        run: task -t tasks.yaml ci
      - name: cache OpenVINO GenAI
        if: always()
        uses: actions/cache@v4
        with:
          path: .cache/ov-genai
          key: ov-genai-${{ hashFiles('tasks.yaml') }}
      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
          retention-days: 30

  e2e:
    name: e2e (model suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - name: cache test model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: e2e-model-${{ hashFiles('scripts/e2e.py') }}
      - name: run e2e suite
        run: task -t tasks.yaml e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download binaries
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
