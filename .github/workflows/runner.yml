name: Runner

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tlc-ovgenai-runner-win32-x64.exe
          - os: ubuntu-latest
            artifact: tlc-ovgenai-runner-linux-x64
          - os: ubuntu-24.04-arm
            artifact: tlc-ovgenai-runner-linux-arm64
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - name: build and loader smoke
        run: task ci
      - name: cache OpenVINO GenAI
        if: always()
        uses: actions/cache@v4
        with:
          path: .cache/ov-genai
          key: ov-genai-${{ hashFiles('Taskfile.yaml') }}
      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
          retention-days: 30

  e2e:
    name: e2e (model suite)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - name: cache OpenVINO GenAI runtime
        uses: actions/cache@v4
        with:
          path: .cache/ov-genai
          key: ov-genai-${{ hashFiles('Taskfile.yaml') }}-linux
      - name: fetch runtime on cache miss
        run: task runtime
      - name: download prebuilt runner
        uses: actions/download-artifact@v5
        with:
          name: tlc-ovgenai-runner-linux-x64
          path: build
      # artifact upload/download does not preserve the executable bit
      - name: restore exec bit
        run: chmod +x build/tlc-ovgenai-runner-linux-x64
      - name: cache test model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: e2e-model-${{ hashFiles('scripts/e2e.py') }}
      - name: run e2e suite
        run: task e2e:prebuilt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      # A pushed tag publishes immediately: refuse when it is not on main,
      # so experimental branches cannot ship releases by accident.
      - name: verify the tag is on main
        run: |
          git init -q .
          git fetch -q origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} is not on main — release refused; tag the merge commit on main instead"
            exit 1
          }
      - name: download binaries
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
