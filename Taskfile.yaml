# Build automation: `task <task>`. See README.md for usage.

version: '3'

vars:
  OV_VERSION: '2026.4.1' # server path; file names embed the full OV_PKG_VERSION
  OV_PKG_VERSION: '2026.4.1.0'
  OV_CACHE_DIR: '.cache/ov-genai'
  BUILD_DIR: 'build'
  URL_LINUX: 'https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/{{.OV_VERSION}}/linux/openvino_genai_ubuntu24_{{.OV_PKG_VERSION}}_x86_64.tar.gz'
  URL_WINDOWS: 'https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/{{.OV_VERSION}}/windows/openvino_genai_windows_{{.OV_PKG_VERSION}}_x86_64.zip'
  URL_MAC: 'https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/pre-release/{{.OV_MAC_VERSION}}/openvino_genai_macos_12_6_{{.OV_MAC_VERSION}}_arm64.tar.gz'
  DIR_LINUX: '{{.OV_CACHE_DIR}}/linux/openvino_genai_ubuntu24_{{.OV_PKG_VERSION}}_x86_64'
  DIR_WINDOWS: '{{.OV_CACHE_DIR}}/windows/openvino_genai_windows_{{.OV_PKG_VERSION}}_x86_64'
  DIR_MAC: '{{.OV_CACHE_DIR}}/mac/openvino_genai_macos_12_6_{{.OV_MAC_VERSION}}_arm64'
  OV_DIR_POSIX: '{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/cmake'
  OV_LIB_POSIX: '{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/lib/intel64:{{.USER_WORKING_DIR}}/{{if eq OS "darwin"}}{{.DIR_MAC}}{{else}}{{.DIR_LINUX}}{{end}}/runtime/3rdparty/tbb/lib'
  MODEL_DIR: '.cache/models/qwen2.5-coder-0.5b-int8-ov'

tasks:
  default:
    desc: Download the OpenVINO runtime, build the runner for the host OS and run unit tests
    cmds:
      - task: test

  runtime:
    desc: Download and unpack the OpenVINO GenAI archive for the host OS
    deps: ['runtime:{{if eq OS "windows"}}windows{{else if eq OS "darwin"}}mac{{else}}linux{{end}}']

  runtime:linux:
    status:
      - test -d '{{.DIR_LINUX}}/runtime/lib'
    cmds:
      - mkdir -p '{{.OV_CACHE_DIR}}/linux'
      - task: download
        vars: { URL: '{{.URL_LINUX}}', FILE: '{{.OV_CACHE_DIR}}/linux/ov.tgz' }
      - tar xzf '{{.OV_CACHE_DIR}}/linux/ov.tgz' -C '{{.OV_CACHE_DIR}}/linux'
      - rm '{{.OV_CACHE_DIR}}/linux/ov.tgz'
    generates:
      - '{{.DIR_LINUX}}/runtime/lib/**'

  runtime:mac:
    status:
      - test -d '{{.DIR_MAC}}/runtime/lib'
    cmds:
      - mkdir -p '{{.OV_CACHE_DIR}}/mac'
      - task: download
        vars: { URL: '{{.URL_MAC}}', FILE: '{{.OV_CACHE_DIR}}/mac/ov.tgz' }
      - tar xzf '{{.OV_CACHE_DIR}}/mac/ov.tgz' -C '{{.OV_CACHE_DIR}}/mac'
      - rm '{{.OV_CACHE_DIR}}/mac/ov.tgz'
    generates:
      - '{{.DIR_MAC}}/runtime/lib/**'

  runtime:windows:
    platforms: [windows]
    status:
      - powershell -Command "if (!(Test-Path '{{.DIR_WINDOWS}}\runtime\bin')) { exit 1 }"
    cmds:
      - powershell -Command "New-Item -ItemType Directory -Force '{{.OV_CACHE_DIR}}\windows' | Out-Null"
      - task: download
        vars: { URL: '{{.URL_WINDOWS}}', FILE: '{{.OV_CACHE_DIR}}/windows/ov.zip' }
      - C:/Windows/System32/tar.exe -xf '{{.OV_CACHE_DIR}}\windows\ov.zip' -C '{{.OV_CACHE_DIR}}\windows'
      - powershell -Command "Remove-Item '{{.OV_CACHE_DIR}}\windows\ov.zip'"
    generates:
      - '{{.DIR_WINDOWS}}/runtime/bin/**'

  download:
    desc: Resumable download; retries on bad responses and HTML error pages (server answers 200 for missing keys)
    cmds:
      - |
        f='{{.FILE}}'
        case "$f" in
          *.zip) magic='504b' ;;   # PK, zip local header
          *)     magic='1f8b' ;;   # gzip magic
        esac
        hex() { head -c 2 "$1" | od -An -tx1 | tr -d ' \n'; }
        for i in 1 2 3 4 5 6; do
          [ -f "$f" ] && [ "$(hex "$f")" != "$magic" ] && rm -f "$f"
          curl -fSsL -C - --retry 3 --retry-delay 2 '{{.URL}}' -o "$f" && [ "$(hex "$f")" = "$magic" ] && exit 0
          echo "download attempt $i failed, resuming..."; sleep 3
        done
        exit 1

  build:
    desc: 'Native runner build for the host OS (mac: clang, win: MSVC)'
    deps: [runtime]
    cmds:
      - task: 'build:{{if eq OS "windows"}}windows{{else}}posix{{end}}'

  build:posix:
    platforms: [linux, darwin]
    cmds:
      - cmake -S . -B '{{.BUILD_DIR}}/{{OS}}' -DOpenVINO_DIR='{{.OV_DIR_POSIX}}' -DOV_GENAI_VERSION='{{.OV_PKG_VERSION}}' -DCMAKE_BUILD_TYPE=Release
      - cmake --build '{{.BUILD_DIR}}/{{OS}}' --config Release
      - mkdir -p '{{.BUILD_DIR}}'
      - cp '{{.BUILD_DIR}}/{{OS}}/tlc-ovgenai-runner' '{{.BUILD_DIR}}/{{if eq OS "linux"}}tlc-ovgenai-runner-linux-x64{{else}}tlc-ovgenai-runner-macos-arm64{{end}}'
    sources:
      - src/**/*
      - CMakeLists.txt
    generates:
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-linux-x64'
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-macos-arm64'

  build:windows:
    platforms: [windows]
    cmds:
      - cmake -S . -B '{{.BUILD_DIR}}\windows' -DOpenVINO_DIR='{{.USER_WORKING_DIR}}\{{.DIR_WINDOWS}}\runtime\cmake' -DOV_GENAI_VERSION='{{.OV_PKG_VERSION}}' -DCMAKE_BUILD_TYPE=Release
      - cmake --build '{{.BUILD_DIR}}\windows' --config Release
      - powershell -Command "New-Item -ItemType Directory -Force '{{.BUILD_DIR}}' | Out-Null; Copy-Item '{{.BUILD_DIR}}\windows\Release\tlc-ovgenai-runner.exe' '{{.BUILD_DIR}}\tlc-ovgenai-runner-win32-x64.exe'"
    sources:
      - src/**/*
      - CMakeLists.txt
    generates:
      - '{{.BUILD_DIR}}/tlc-ovgenai-runner-win32-x64.exe'


  smoke:
    desc: NDJSON smoke run (set MODEL_DIR to an int8-ov model directory)
    deps: [build]
    env:
      DYLD_LIBRARY_PATH: '{{.OV_LIB_POSIX}}'
      LD_LIBRARY_PATH: '{{.OV_LIB_POSIX}}'
    cmds:
      - |
        echo '{"type":"generate","id":1,"prompt":"<|fim_prefix|>def add(a, b):\n    <|fim_suffix|>\n    return a + b<|fim_middle|>","maxTokens":16,"stop":["\n"]}' \
        | {{if eq OS "windows"}}{{.BUILD_DIR}}\tlc-ovgenai-runner-win32-x64.exe{{else}}{{.BUILD_DIR}}/{{if eq OS "linux"}}tlc-ovgenai-runner-linux-x64{{else}}tlc-ovgenai-runner-macos-arm64{{end}}{{end}} \
        --model "${MODEL_DIR:?set MODEL_DIR to an int8-ov model directory}" --device CPU

  clean:
    desc: Remove build artifacts and the downloaded OpenVINO runtime cache
    cmds:
      - rm -rf '{{.BUILD_DIR}}' '{{.OV_CACHE_DIR}}'
      - cmd: powershell -Command "if (Test-Path build) { Remove-Item -Recurse -Force build }; if (Test-Path .cache) { Remove-Item -Recurse -Force .cache }"
        platforms: [windows]

  ci:
    desc: Build for the host OS, run unit tests and the loader smoke check (CI entry point)
    cmds:
      - task: build
      - task: test
      - task: smoke:loader

  test:
    desc: Run unit tests (doctest via ctest)
    deps: [build]
    cmds:
      - cmake --build '{{.BUILD_DIR}}/{{OS}}' --config Release
      - ctest --test-dir '{{.BUILD_DIR}}/{{OS}}' --output-on-failure -C Release

  model:
    desc: Download the default E2E model into {{.MODEL_DIR}}
    status:
      - test -d '{{.MODEL_DIR}}'
    cmds:
      - python3 scripts/e2e.py download-model

  e2e:
    desc: 'Full E2E suite incl. FIM (downloads the default model into .cache if needed)'
    deps: [build, model]
    env:
      E2E_READY_TIMEOUT: '{{.E2E_READY_TIMEOUT | default "300"}}'
    cmds:
      - python3 scripts/e2e.py test --model '{{.MODEL_DIR}}' --device '{{.E2E_DEVICE | default "auto"}}'

  e2e:npu:
    desc: 'Full E2E suite on NPU only (long ready timeout: first load compiles the graph)'
    cmds:
      - task: e2e
        vars: { E2E_DEVICE: NPU, E2E_READY_TIMEOUT: '1800' }

  e2e:gpu:
    desc: Full E2E suite on GPU only
    cmds:
      - task: e2e
        vars: { E2E_DEVICE: GPU }

  e2e:cpu:
    desc: Full E2E suite on CPU only
    cmds:
      - task: e2e
        vars: { E2E_DEVICE: CPU }

  e2e:protocol:
    desc: E2E protocol tests only (no model needed)
    deps: [build]
    cmds:
      - python3 scripts/e2e.py test

  smoke:loader:
    desc: Run the built binary with no args; must exit 2 and emit an error event
    deps: ['smoke:loader:{{if eq OS "windows"}}windows{{else}}posix{{end}}']

  smoke:loader:posix:
    platforms: [linux, darwin]
    env:
      DYLD_LIBRARY_PATH: '{{.OV_LIB_POSIX}}'
      LD_LIBRARY_PATH: '{{.OV_LIB_POSIX}}'
    cmds:
      - |
        code=0
        out=$('{{.BUILD_DIR}}/{{if eq OS "linux"}}tlc-ovgenai-runner-linux-x64{{else}}tlc-ovgenai-runner-macos-arm64{{end}}' 2>/dev/null) || code=$?
        echo "$out"
        [ "$code" -eq 2 ] || { echo "expected exit code 2, got $code" >&2; exit 1; }
        echo "$out" | grep -q '"type":"error"' || { echo "no error event in output" >&2; exit 1; }
        out=$('{{.BUILD_DIR}}/{{if eq OS "linux"}}tlc-ovgenai-runner-linux-x64{{else}}tlc-ovgenai-runner-macos-arm64{{end}}' --version 2>/dev/null) || { echo "--version failed" >&2; exit 1; }
        echo "$out"
        case "$out" in
          *'"type":"version"'*) ;;
          *) echo "no version event in output: $out" >&2; exit 1 ;;
        esac
        case "$out" in
          *'"ovGenai":"{{.OV_PKG_VERSION}}"'*) ;;
          *) echo "unexpected ovGenai version (expected {{.OV_PKG_VERSION}}): $out" >&2; exit 1 ;;
        esac

  smoke:loader:windows:
    platforms: [windows]
    cmds:
      - |
        code=0
        # task interprets cmds with its own sh; ';' is the Windows PATH separator
        export PATH="$PWD/{{.DIR_WINDOWS}}/runtime/bin/intel64/Release;$PWD/{{.DIR_WINDOWS}}/runtime/3rdparty/tbb/bin;$PATH"
        out=$('{{.BUILD_DIR}}/tlc-ovgenai-runner-win32-x64.exe' 2>/dev/null) || code=$?
        echo "$out"
        [ "$code" -eq 2 ] || { echo "expected exit code 2, got $code" >&2; exit 1; }
        case "$out" in
          *'"type":"error"'*) ;;
          *) echo "no error event in output" >&2; exit 1 ;;
        esac
        out=$('{{.BUILD_DIR}}/tlc-ovgenai-runner-win32-x64.exe' --version 2>/dev/null) || { echo "--version failed" >&2; exit 1; }
        echo "$out"
        case "$out" in
          *'"type":"version"'*) ;;
          *) echo "no version event in output: $out" >&2; exit 1 ;;
        esac
        case "$out" in
          *'"ovGenai":"{{.OV_PKG_VERSION}}"'*) ;;
          *) echo "unexpected ovGenai version (expected {{.OV_PKG_VERSION}}): $out" >&2; exit 1 ;;
        esac
